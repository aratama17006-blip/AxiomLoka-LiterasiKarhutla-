{t:['Penyebab Karhutla','Causes of Fires'],ic:'flame',a:'cause',pts:[['Pemerintah (KLHK/BNPB) menyatakan sebagian besar Karhutla dipicu ulah manusia, sengaja maupun lalai.','The government (KLHK/BNPB) states most fires are triggered by people, intentionally or through negligence.']],more:[['UU 32/2009 Pasal 69 melarang membuka lahan dengan membakar, dengan pengecualian terbatas bagi kearifan lokal. Undang-undang ini telah diubah (antara lain oleh UU 6/2023), jadi periksa versi terkini di JDIH atau peraturan.go.id.','Law 32/2009 Art. 69 bans clearing land by burning, with limited local-wisdom exceptions. The law has been amended (including by Law 6/2023), so check the current version on JDIH or peraturan.go.id.']]},
{t:['Bagaimana Api Terjadi?','How Does a Fire Start?'],ic:'flame',a:'tri',pts:[['Api butuh tiga hal: bahan bakar, oksigen, dan panas. Hilangkan satu, api padam.','Fire needs three things: fuel, oxygen, and heat. Remove one and it goes out.'],['Kemarau dan angin mempercepat api menyebar.','Dry weather and wind make fire spread faster.']]},
{t:['Mengenal Lahan Basah','Getting to Know Wetlands'],ic:'drop',a:'wet',pts:[['Lahan basah adalah wilayah yang tergenang atau jenuh air: rawa, gambut, mangrove, danau, dan sungai.','Wetlands are flooded or water-saturated areas: swamps, peat, mangroves, lakes, and rivers.'],['Fungsi ekologis: menyimpan air, meredam banjir, menjadi habitat satwa, dan menyimpan karbon.','Ecological functions: storing water, reducing floods, sheltering wildlife, and storing carbon.'],['Di Kalimantan Selatan, masyarakat hidup berdampingan dengan sungai dan rawa: permukiman tepi sungai, transportasi sungai, pasar terapung, dan pertanian lahan rawa.','In South Kalimantan, people live alongside rivers and swamps: riverside settlements, river transport, floating markets, and swamp farming.']],more:[['Konvensi Ramsar (1971) adalah perjanjian internasional untuk perlindungan lahan basah. Indonesia meratifikasinya melalui Keppres 48/1991.','The Ramsar Convention (1971) is the international treaty for wetland protection. Indonesia ratified it through Presidential Decree 48/1991.']]},
{t:['Mengenal Lahan Gambut','Getting to Know Peatlands'],ic:'leaf',a:'peat',pts:[['Gambut terbentuk dari sisa tumbuhan yang terurai tidak sempurna dan menumpuk selama ratusan hingga ribuan tahun dalam kondisi jenuh air.','Peat forms from partly decomposed plant matter piling up over hundreds to thousands of years in waterlogged conditions.'],['Menurut PP 71/2014, gambut memiliki ketebalan 50 cm atau lebih.','Under Government Reg. 71/2014, peat is 50 cm or more thick.'],['Fungsinya: seperti spons yang menyimpan air, dan menyimpan karbon dalam jumlah besar.','Its functions: like a sponge it stores water, and it holds large amounts of carbon.']]},
{t:['Gambut dan Karhutla','Peat and Fire'],ic:'flame',a:'sim',pts:[['Kanal dan pembukaan lahan menurunkan muka air gambut.','Canals and land clearing lower the peat water table.'],['Gambut kering menjadi bahan bakar, dapat sulit menyerap air kembali, dan apinya bisa membara di bawah tanah.','Dry peat becomes fuel, may struggle to reabsorb water, and fire can smolder underground.'],['Menjaga kelembapan gambut adalah kunci pencegahan.','Keeping peat moist is the key to prevention.']],more:[['PP 71/2014 jo. PP 57/2016: ekosistem gambut dinyatakan rusak bila muka air tanah lebih dari 0,4 m di bawah permukaan gambut pada titik penaatan.','Gov. Reg. 71/2014 as amended by 57/2016: a peat ecosystem is deemed damaged when groundwater is deeper than 0.4 m below the peat surface at the compliance point.']]},
{t:['Dampak Lingkungan','Environmental Impact'],ic:'leaf',a:'ba',pts:[['Tutupan hutan dan keanekaragaman hayati rusak; satwa kehilangan habitat dan makanan.','Forest cover and biodiversity are damaged; wildlife loses habitat and food.'],['Karhutla melepas karbon dan gas rumah kaca ke atmosfer.','Fires release carbon and greenhouse gases into the atmosphere.'],['Tanah rusak dan pemulihan ekosistem memakan waktu lama.','Soil is damaged and ecosystem recovery takes a long time.']]},
{t:['Dampak Kesehatan','Health Impact'],ic:'warn',a:'ispu',pts:[['Asap mengandung partikel halus PM2.5 yang dapat masuk jauh ke paru-paru.','Smoke contains fine PM2.5 particles that can reach deep into the lungs.'],['Gejala umum: batuk, mata perih, sesak, dan infeksi saluran pernapasan.','Common symptoms: cough, sore eyes, breathlessness, and respiratory infections.'],['Anak-anak, lansia, ibu hamil, dan penderita asma paling rentan. Saat asap pekat, tetap di dalam ruangan dan gunakan masker N95/KN95 bila harus keluar.','Children, elders, pregnant women, and people with asthma are most vulnerable. In thick smoke, stay indoors and wear an N95/KN95 mask if you must go out.']],more:[['Pedoman WHO 2021: rata-rata 24 jam PM2.5 sebaiknya tidak melebihi 15 µg/m³. Kategori ISPU diatur dalam Permen LHK P.14/2020.','WHO 2021 guideline: 24-hour mean PM2.5 should not exceed 15 µg/m³. ISPU categories are set in Ministerial Reg. P.14/2020.']]},
{t:['Dampak Sosial dan Ekonomi','Social and Economic Impact'],ic:'warn',a:'match',pts:[['Sekolah dapat diliburkan, transportasi terganggu, dan aktivitas usaha terhambat.','Schools may close, transport is disrupted, and businesses are hampered.'],['Bank Dunia memperkirakan kerugian krisis api 2015 sekitar Rp221 triliun.','The World Bank estimated losses from the 2015 fire crisis at about Rp221 trillion.']]},
{t:['Studi Kasus Indonesia','Indonesian Case Studies'],ic:'book',a:'case'},
{t:['Pencegahan Karhutla','Preventing Fires'],ic:'leaf',a:'tl',pts:[['Pembukaan lahan tanpa bakar: gunakan cara mekanis atau pengomposan.','Clear land without burning: use mechanical methods or composting.'],['Pencegahan: patroli terpadu, peringatan dini, sekat bakar, dan penegakan hukum.','Prevention: joint patrols, early warning, firebreaks, and law enforcement.'],['Restorasi gambut: pembasahan kembali (sekat kanal), penanaman kembali, dan pemulihan mata pencaharian warga.','Peat restoration: rewetting (canal blocks), replanting, and reviving local livelihoods.']],more:[['Badan Restorasi Gambut dibentuk pada 2016 (Perpres 1/2016) dan kemudian menjadi BRGM (Perpres 120/2020). Periksa status kelembagaan terbaru karena struktur kementerian berubah pada 2024.','The Peatland Restoration Agency was formed in 2016 (Presidential Reg. 1/2016) and later became BRGM (Presidential Reg. 120/2020). Check the latest institutional status, as ministries were restructured in 2024.']]},
{t:['Peran Masyarakat dan Generasi Muda','Roles of Communities and Youth'],ic:'leaf',a:'youth',pts:[['Pemerintah: patroli, penegakan hukum, dan restorasi. Masyarakat: ikut menjaga, misalnya melalui kelompok Masyarakat Peduli Api.','Government: patrols, enforcement, and restoration. Communities: help protect, for example through Masyarakat Peduli Api groups.'],['Generasi muda: belajar, berbagi informasi yang benar, berkampanye kreatif, dan menjadi relawan.','Youth: learn, share accurate information, run creative campaigns, and volunteer.'],['Saat melihat api: jauhi lokasi dan hubungi 112, BPBD, atau Manggala Agni setempat. Kontak dapat berbeda per daerah, jadi pastikan nomor resmi.','If you see fire: keep away and call 112, local BPBD, or Manggala Agni. Contacts vary by region, so confirm official numbers.']]},
{t:['Literasi Digital dan Verifikasi','Digital Literacy and Verification'],ic:'warn',a:'hoax',pts:[['Cek sumber: apakah dari BMKG, BNPB, BPBD, KLHK/Kemenhut, atau media kredibel?','Check the source: is it from BMKG, BNPB, BPBD, the ministry, or credible media?'],['Cek tanggal dan lokasi. Foto lama sering dipakai ulang sebagai berita baru.','Check date and location. Old photos are often reused as new news.'],['Cek foto atau video dengan pencarian gambar terbalik (misalnya Google Lens atau TinEye).','Check photos or videos with reverse image search (for example Google Lens or TinEye).'],['Bandingkan dengan data resmi: titik panas BMKG dan SiPongi, informasi BNPB dan BPBD.','Compare with official data: BMKG and SiPongi hotspots, BNPB and BPBD information.'],['Sebelum membagikan: tahan dulu, verifikasi, dan gunakan bahasa tenang tanpa menimbulkan kepanikan.','Before sharing: pause, verify, and use calm wording that does not cause panic.']],more:[['Membaca titik panas: titik panas adalah indikator wilayah bersuhu relatif tinggi yang dideteksi satelit, bukan bukti pasti ada api. Perhatikan tanggal, tingkat kepercayaan (confidence), dan konfirmasi petugas di lapangan. Jumlah titik panas bukan luas area terbakar.','Reading hotspots: a hotspot is an indicator of a relatively hot area detected by satellite, not proof of fire. Check the date, confidence level, and ground confirmation. Hotspot count is not burned area.']]},

{n:['Kalimantan Selatan','South Kalimantan'],v:1,r:[[ 'Kalimantan Selatan; kejadian berulang saat kemarau, termasuk 2015 dan 2019.','South Kalimantan; recurring in dry seasons, including 2015 and 2019.'],['Kebakaran lahan, termasuk lahan rawa dan gambut, memicu kabut asap di sekitar kota-kota besar. Rincian lokasi dan tanggal perlu diverifikasi.','Fires on land including swamp and peat caused haze near major cities. Location and date details need verification.'],['Luas terbakar, jumlah titik panas, dan data ISPU per tahun: data perlu diverifikasi di SiPongi, BMKG, dan BPBD Kalsel.','Burned area, hotspot counts, and ISPU data per year: verify with SiPongi, BMKG, and BPBD South Kalimantan.'],['Pemadaman darat dan udara dikoordinasikan BPBD, Manggala Agni, TNI, dan Polri. Status siaga darurat pada 2019 perlu diverifikasi.','Ground and air suppression were coordinated by BPBD, Manggala Agni, the military, and police. The 2019 emergency status needs verification.'],['Lahan rawa dan gambut lokal perlu dijaga lembap; peringatan dini dan pelaporan warga sangat penting.','Local swamp and peat must be kept moist; early warning and citizen reporting are vital.']]},
{n:['Kalimantan Tengah','Central Kalimantan'],v:1,r:[['Kalimantan Tengah, termasuk sekitar Palangka Raya dan bekas kawasan Proyek Lahan Gambut Sejuta Hektare; terutama 2015 dan 2019.','Central Kalimantan, including around Palangka Raya and the former One Million Hectare Peatland Project area; mainly 2015 and 2019.'],['Kebakaran gambut meluas dan kabut asap pekat mengganggu warga. Angka rinci perlu diverifikasi.','Widespread peat fires and thick haze disrupted residents. Exact figures need verification.'],['Gangguan kesehatan dan aktivitas akibat asap tercatat; angka ISPU, luas, dan korban perlu diverifikasi di sumber resmi.','Smoke-related health and activity disruption was recorded; ISPU, area, and casualty figures need verification from official sources.'],['Pemadaman darat-udara, pembuatan sekat kanal dan pembasahan gambut oleh badan restorasi, serta penegakan hukum.','Ground-air suppression, canal blocking and peat rewetting by the restoration agency, and law enforcement.'],['Kanal drainase pada gambut meningkatkan risiko kebakaran; restorasi tata air sangat penting.','Drainage canals in peat raise fire risk; restoring water management is essential.']]},
{n:['Indonesia 2015','Indonesia 2015'],r:[['Indonesia, terutama Sumatra dan Kalimantan; puncaknya sekitar September–Oktober 2015 saat kemarau panjang.','Indonesia, mainly Sumatra and Kalimantan; peaking around September–October 2015 in a long dry season.'],['Kebakaran besar dengan kabut asap lintas batas ke negara tetangga.','Major fires with transboundary haze reaching neighboring countries.'],['Sekitar 2,61 juta ha terbakar (SiPongi KLHK). Estimasi kerugian ekonomi sekitar Rp221 triliun (Bank Dunia, 2016).','About 2.61 million ha burned (SiPongi KLHK). Economic loss estimated at about Rp221 trillion (World Bank, 2016).'],['Pembentukan Badan Restorasi Gambut (Perpres 1/2016) dan penguatan aturan perlindungan gambut (PP 57/2016).','Creation of the Peatland Restoration Agency (Presidential Reg. 1/2016) and stronger peat protection rules (Gov. Reg. 57/2016).'],['Mencegah jauh lebih murah daripada memadamkan; tata kelola gambut menentukan.','Prevention is far cheaper than suppression; peat management is decisive.']]},
{n:['Indonesia 2019','Indonesia 2019'],v:1,r:[['Indonesia; terutama pada kemarau 2019, termasuk Riau, Jambi, Sumatra Selatan, Kalimantan Barat, Tengah, dan Selatan (perlu diverifikasi).','Indonesia; mainly in the 2019 dry season, including Riau, Jambi, South Sumatra, and West, Central, and South Kalimantan (to be verified).'],['Karhutla di banyak provinsi dengan kabut asap di berbagai kota.','Fires in many provinces with haze in many cities.'],['Sekitar 1,65 juta ha terbakar (SiPongi KLHK). Estimasi kerugian Bank Dunia 2019 perlu diverifikasi.','About 1.65 million ha burned (SiPongi KLHK). The 2019 World Bank loss estimate needs verification.'],['Penetapan status siaga darurat di sejumlah provinsi, pemadaman darat dan udara, serta teknologi modifikasi cuaca (perlu diverifikasi).','Emergency status in several provinces, ground and air suppression, and weather modification (to be verified).'],['Pencegahan dini saat kemarau dan pemantauan titik panas harus diperkuat.','Early prevention in the dry season and stronger hotspot monitoring are needed.']]}];

case 'wel':return say([ 'Yuk, kenali bahaya Karhutla sebelum terlambat!','Let’s understand the dangers of forest fires before it’s too late!'],1.3)+`<div class="grid" style="margin-top:12px">${P.map((q,j)=>j>1?`<button onclick="go(${j})">${j+1}. ${T(q.t)}</button>`:'').join('')}</div>`;
case 'cmp':return `<div class="two"><div><div class="scn">${scene(0)}</div><small>${lg?'Healthy forest':'Hutan sehat'}</small></div><div><div class="scn">${scene(1)}</div><small>${lg?'Burned forest':'Hutan terbakar'}</small></div></div>`;
case 'fact':return `<div class="grid">${ST.map(s=>`<div class="cell"><span class="big">${s[0]}</span><small>${s[lg+1]}</small></div>`).join('')}</div><p class="warn">${lg?'Figures come from official/historical sources and may be updated; verify on the source sites on the References page.':'Angka berasal dari sumber resmi/historis dan dapat diperbarui; verifikasi di situs sumber pada halaman Referensi.'}</p><div class="grid" style="margin-top:10px">${FL.map(c=>`<button class="flip" aria-pressed="false" onclick="this.classList.toggle('on');this.setAttribute('aria-pressed',this.classList.contains('on'))"><span class="f">${T(c[0])}</span><span class="b">${T(c[1])}</span></button>`).join('')}</div>`;
case 'cause':return `<div class="two s"><div class="cell" style="border-color:var(--yel)"><b>${lg?'Natural factors':'Faktor alam'}</b><p>${lg?'Long dry spells, El Niño, lightning is rare':'Kemarau panjang, El Niño'}</p></div><div class="cell" style="border-color:var(--fire)"><b>${lg?'Human activity':'Aktivitas manusia'}</b><p>${lg?'Burning to clear land, cigarette butts, campfires, burning waste':'Membakar untuk membuka lahan, puntung rokok, api unggun, membakar sampah'}</p></div></div><div class="cell"><b>${lg?'Aggravating condition':'Kondisi yang memperparah'}</b><p>${lg?'Peat drained by canals becomes dry fuel.':'Gambut yang dikeringkan kanal menjadi bahan bakar kering.'}</p></div>`;
case 'tri':return tri();
case 'wet':return cyc()+hsb()+`<div class="fl" style="margin-top:10px">${[['Rawa','Swamp'],['Gambut','Peat'],['Mangrove','Mangrove'],['Danau','Lake'],['Sungai','River']].map(x=>`<b>${T(x)}</b>`).join('')}</div>`;
case 'peat':return cut(20,1)+hsb();
case 'sim':return `<div id="cs"></div><label>${T(U.depth)}: <b id="dv">20</b> cm <input type="range" min="0" max="100" value="20" oninput="cs(this.value)" aria-label="${T(U.depth)}"></label><div class="box on" id="cm" role="status"></div>`;
case 'ba':return `<div class="ba"><div class="scn">${scene(0)}</div><div class="scn ov" id="ov">${scene(1)}</div></div><input type="range" min="0" max="100" value="50" oninput="$('ov').style.clipPath='inset(0 0 0 '+this.value+'%)'" aria-label="${T(U.slide)}"><small class="src">${T(U.slide)}</small>`;
case 'ispu':return `<div class="ispu" role="img" aria-label="ISPU">${IS.map(s=>`<div style="background:${s[2]}"><b>${s[0]}</b><br>${T(s[1])}</div>`).join('')}</div>`+say([ 'Pakai masker N95/KN95 saat asap pekat!','Wear an N95/KN95 mask when smoke is thick!'],.8);
case 'match':return `<p class="src">${T(U.mh)}</p><div class="two">`+`<div>${MT.map((x,k)=>`<button class="mb${ms===k?' sel':''}${md.includes(k)?' ok':''}" ${md.includes(k)?'disabled':''} onclick="ml(${k})">${T(x[0])}</button>`).join('')}</div><div>${[2,0,3,1].map(k=>`<button class="mb${md.includes(k)?' ok':''}${mw===k?' no':''}" ${md.includes(k)?'disabled':''} onclick="mr(${k})">${T(MT[k][1])}</button>`).join('')}</div></div><div role="status" aria-live="polite">${md.length==4?`<div class="box on">${T(U.md)} <button onclick="md=[];ms=null;mw=-1;render(0)">${T(U.retry)}</button></div>`:''}</div>`;
case 'case':{const c=CS[c0];return `<div class="tabs" role="tablist">${CS.map((x,k)=>`<button role="tab" aria-selected="${k==c0}" class="${k==c0?'sel':''}" onclick="c0=${k};render(0)">${T(x.n)}</button>`).join('')}</div>`+c.r.map((r,k)=>`<div class="cell"><b>${T(U.cf[k])}</b><p>${T(r)}</p></div>`).join('')+(c.v?`<p class="warn">${T(U.verify)}</p>`:'')}
case 'tl':return `<div class="tl">${[['Kenali','Know'],['Cegah','Prevent'],['Basahi gambut','Rewet peat'],['Pantau','Monitor'],['Laporkan','Report']].map((s,k)=>`<div><em>${k+1}</em>${T(s)}</div>`).join('')}</div>`;
case 'youth':return say([ 'Kamu bisa jadi pahlawan hutan: mulai dari berbagi informasi yang benar!','You can be a forest hero: start by sharing accurate information!'],1.2);
case 'hoax':return `<div class="two s">${['a','b'].map((k,j)=>`<div class="cell post"><small class="src">${T(U.sim)} · ${j?'B':'A'}</small><p>${T(HX[k])}</p>${hx==null?`<button onclick="hx=${j};render(0)">${T(U.cred)}</button>`:''}</div>`).join('')}</div><div role="status" aria-live="polite">${hx==null?'':`<div class="box on"><b>${hx==1?T(U.ok):T(U.no)}</b> ${T(HX.fa)}<br>${T(HX.fb)} <button onclick="hx=null;render(0)">${T(U.retry)}</button></div>`}</div>`;}return ''}
function myth(){return MY.map((x,k)=>{const v=my[k];return `<div class="cell"><p><b>${T(x.s)}</b></p>${v==null?`<div class="row"><button onclick="mp(${k},0)">${T(U.myth)}</button><button onclick="mp(${k},1)">${T(U.fact)}</button></div>`:`<div class="box on" role="status"><b>${v==x.a?T(U.ok):T(U.no)}</b> ${T(x.a?U.isfact:U.ismyth)}. ${T(x.e)}</div>`}</div>`}).join('')}
function quiz(){if(qi>=Q.length){const b=sc>=9?0:sc>=7?1:sc>=5?2:3;return `<p class="src">${T(U.score)}</p><span class="big">${sc} / ${Q.length}</span><p>${T(U.ev[b])}</p><div class="row"><button class="p" onclick="sc=0;qi=0;pk=null;render(0)">${T(U.retry)}</button><button onclick="go(i+1)">${T(U.nq)} →</button></div>`}const q=Q[qi];return `<p class="src">${T(U.qn)} ${qi+1}/${Q.length}</p><p class="q">${T(q.q)}</p>${q.o.map((o,j)=>`<button class="opt${pk!==null&&j==q.a?' ok':''}${pk===j&&j!=q.a?' no':''}" ${pk!==null?'disabled':''} onclick="pick(${j})">${T(o)}</button>`).join('')}<div role="status" aria-live="polite">${pk!==null?`<div class="box on"><b>${pk==q.a?T(U.ok):T(U.no)}</b> ${T(q.e)}</div><div class="row"><button class="p" onclick="qi++;pk=null;render(0)">${T(U.nq)}</button></div>`:''}</div>`}
function cs(v){$('cs').innerHTML=cut(+v);$('dv').textContent=v;$('cm').innerHTML=v>40?(lg?'<b>High fire risk.</b> Water deeper than 40 cm: dry peat becomes fuel.':'<b>Risiko kebakaran tinggi.</b> Muka air lebih dalam dari 40 cm: gambut kering menjadi bahan bakar.'):(lg?'<b>Safer.</b> Peat stays moist like a sponge.':'<b>Lebih aman.</b> Gambut tetap lembap seperti spons.')}
function bx(b){const x=b.parentNode.nextElementSibling,o=x.classList.toggle('on');b.setAttribute('aria-expanded',o)}
function ml(k){ms=k;mw=-1;render(0)}function mr(k){if(ms===null)return;if(ms===k)md.push(k);else mw=k;ms=null;render(0)}
function mp(k,v){my[k]=v;render(0)}function pick(j){if(pk!==null)return;pk=j;if(j==Q[qi].a)sc++;render(0)}
function render(a){const p=P[i];let h='';const hero=(t,e)=>`<div class="hero">${ico(p.ic||'leaf')}<div>${e}</div></div>`;
if(p.k=='cover')h=`<div class="pg cover${a?' anim':''}"><div class="hero"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#FFC857" stroke-width="1.6" aria-hidden="true">${IC.flame}</svg><h1>${lg?'UNDERSTANDING FOREST AND LAND FIRES':'MENGENAL KARHUTLA'}</h1><b>${lg?'Protect Forests, Protect Our Future':'Lindungi Hutan, Jaga Masa Depan'}</b><div class="scn" style="width:100%">${scene(1)}</div>${say(['Halo, aku Rimba dari kelompok Axiom Loka, penjaga hutan! Yuk, jelajahi bersamaku.','Hi, I’m Rimba from the Axiom Loka group, the forest ranger! Explore with me.'])}<button class="p" onclick="go(1)">${T(U.start)}</button></div></div>`;
else{let b='';if(p.k=='myth')b=myth();else if(p.k=='quiz')b=quiz();else if(p.k=='close')b=`<div class="scn" style="height:110px">${scene(0)}</div>${say(['Satu tindakan kecil hari ini, satu napas lega esok hari. Terima kasih sudah peduli! Salam, Rimba dari kelompok Axiom Loka.','One small action today, one easier breath tomorrow. Thank you for caring! Regards, Rimba from the Axiom Loka group.'])}<div class="row"><button class="p" onclick="go(0)">${T(U.home)}</button><button onclick="go(i+1)">${lg?'References':'Referensi'} →</button></div>`;else if(p.k=='ref')b=`<p class="warn">${lg?'Links are provided to find the primary sources. Please open each one and verify the data and the current legal status before citing.':'Tautan disediakan untuk menemukan sumber primer. Buka tiap tautan dan verifikasi data serta status keberlakuan hukum sebelum dikutip.'}</p><ol class="ref">${R.map(r=>`<li>${r[0]} (${r[1]}). <a href="${r[2]}" target="_blank" rel="noopener noreferrer">${r[2]}</a><br><em>${T(U.ctx)}: ${T(r[3])}</em></li>`).join('')}</ol>`;else{b=(p.pts?`<ul class="pts">${p.pts.map(x=>`<li>${T(x)}</li>`).join('')}</ul>`:'')+(p.more?`<div class="row"><button aria-expanded="false" onclick="bx(this)">${T(U.more)}</button></div><div class="box">${T(p.more[0])}</div>`:'')+(p.fact?`<div class="row"><button aria-expanded="false" onclick="bx(this)">${T(U.fun)}</button></div><div class="box">${T(p.fact[0])}</div>`:'')}
h=`<div class="pg${a?' anim':''}"><div class="hero">${ico(p.ic||'leaf')}<h2>${T(p.t)}</h2></div>${p.a?`<div class="art">${ART(p.a)}</div>`:''}<div class="body">${b}</div></div>`}
m.innerHTML=h;if(P[i].a=='sim')cs(20);$('cnt').textContent=(i+1)+' / '+P.length;$('pr').style.width=((i+1)/P.length*100)+'%';$('pv').disabled=i==0;$('nx').disabled=i==P.length-1;
m.querySelectorAll('.big').forEach(el=>{const x=el.textContent.match(/^([\d,]+)(.*)$/);if(!x)return;const dc=x[1].includes(',')?x[1].split(',')[1].length:0,v=parseFloat(x[1].replace(',','.'));let s=null;const f=t=>{s=s||t;const q=Math.min((t-s)/800,1);el.textContent=(v*q).toFixed(dc).replace('.',',')+x[2];if(q<1)requestAnimationFrame(f)};if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(f)});
buildToc()}
function buildToc(){$('tl').innerHTML=P.map((q,j)=>`<button onclick="go(${j})" ${j==i?'aria-current="page" class="sel"':''}>${j+1}. ${T(q.t)}</button>`).join('')}
function applyUI(){document.documentElement.lang=lg?'en':'id';$('bh').textContent='⌂ '+T(U.home);$('bt').textContent=lg?'Understanding Forest and Land Fires':'Mengenal Karhutla';$('bc').textContent='☰ '+T(U.toc);$('tt').textContent=T(U.toc);$('pv').textContent=T(U.prev);$('nx').textContent=T(U.next);$('l0').setAttribute('aria-pressed',!lg);$('l1').setAttribute('aria-pressed',!!lg);document.body.style.setProperty('--z',z)}
function setL(n){lg=n;ss.set('k_l',n);applyUI();render(0)}
function setZ(d){z=Math.max(.9,Math.min(1.4,+(z+d*.12).toFixed(2)));ss.set('k_z',z);applyUI()}
function go(n){i=Math.max(0,Math.min(P.length-1,n));ss.set('k_i',i);closeToc();render(1);window.scrollTo(0,0);const h=m.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
function openToc(){$('toc').classList.add('on');const b=$('tl').querySelector('.sel')||$('tl').firstChild;if(b)b.focus()}function closeToc(){$('toc').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeToc();if(e.target.closest&&e.target.closest('input'))return;if(e.key=='ArrowRight')go(i+1);if(e.key=='ArrowLeft')go(i-1);if(e.key=='Enter'||e.key==' '){const g=e.target.closest&&e.target.closest('.hs');if(g){e.preventDefault();g.dispatchEvent(new Event('click',{bubbles:true}))}}});
m.addEventListener('click',e=>{const g=e.target.closest('.hs');if(g&&$('hsb'))$('hsb').innerHTML=T(HT[g.dataset.k][0])});
let tx=0,ty=0,tk=true;document.addEventListener('touchstart',e=>{tk=!e.target.closest('input,.hs,.ba');tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(!tk)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(i+(dx<0?1:-1))},{passive:true});
(function(){const a=+ss.get('k_i'),l=+ss.get('k_l'),zz=parseFloat(ss.get('k_z'));if(a>=0&&a<P.length)i=a;if(l===1)lg=1;if(zz>=.9&&zz<=1.4)z=zz;applyUI();render(0)})();
</script></body></html>
